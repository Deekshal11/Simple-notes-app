<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
            background: #f1f5f9;
        }
        h1 { color: #1d4ed8; }
        form, li {
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
        }
        input {
            padding: 10px;
            width: 70%;
        }
        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
        ul { padding: 0; list-style: none; }
    </style>
</head>
<body>
    <h1>Simple Notes App</h1>
    <p>My first cloud-deployed notes application.</p>

    <form action="/add" method="post">
        <input name="content" placeholder="Write a note..." required>
        <button type="submit">Add Note</button>
    </form>

    <h2>Saved Notes</h2>
    <ul>
        {% for note in notes %}
        <li>{{ note[1] }}</li>
        {% else %}
        <li>No notes yet. Add your first note!</li>
        {% endfor %}
    </ul>

    <p><a href="/health">Check application health</a></p>
</body>
</html>
